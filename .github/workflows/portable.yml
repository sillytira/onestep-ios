name: Build Android Windows Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['portable/**', '.github/workflows/portable.yml']
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: portable
      - run: dart format lib test
        working-directory: portable
      - run: flutter analyze --no-fatal-infos
        working-directory: portable
      - run: flutter test
        working-directory: portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OneStep-portable-formatted-source
          path: |
            portable/lib/
            portable/test/
            portable/pubspec.lock
  android:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Reuse beta signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: onestep-android-beta-key-v1
      - run: node portable/tool/bootstrap.mjs
      - run: flutter pub get
        working-directory: portable
      - run: flutter build apk --release
        working-directory: portable
      - name: Package APK
        run: |
          mkdir -p release
          cp portable/build/app/outputs/flutter-apk/app-release.apk release/OneStep-0.3.0-beta.apk
          sha256sum release/*.apk > release/OneStep-0.3.0-beta.apk.sha256
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging release/*.apk | head -20
          cp portable/pubspec.lock release/
      - uses: actions/upload-artifact@v4
        with:
          name: OneStep-0.3.0-Android
          path: release/
  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: node portable/tool/bootstrap.mjs
      - run: flutter pub get
        working-directory: portable
      - run: flutter build windows --release
        working-directory: portable
      - name: Package and smoke-test executable
        shell: pwsh
        run: |
          New-Item release -ItemType Directory -Force
          $bundle = Resolve-Path portable/build/windows/x64/runner/Release
          Copy-Item "$env:WINDIR/System32/msvcp140.dll","$env:WINDIR/System32/vcruntime140.dll","$env:WINDIR/System32/vcruntime140_1.dll" -Destination $bundle
          $process = Start-Process -FilePath "$bundle/Tira-OneStep.exe" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "OneStep exited during launch smoke test" }
          Stop-Process -Id $process.Id
          Compress-Archive -Path "$bundle/*" -DestinationPath release/OneStep-0.3.0-Windows.zip
          (Get-FileHash release/OneStep-0.3.0-Windows.zip -Algorithm SHA256).Hash.ToLower() + '  OneStep-0.3.0-Windows.zip' | Set-Content release/OneStep-0.3.0-Windows.zip.sha256
          Copy-Item portable/pubspec.lock release/
      - uses: actions/upload-artifact@v4
        with:
          name: OneStep-0.3.0-Windows
          path: release/
  linux:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb libfuse2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: node portable/tool/bootstrap.mjs
      - run: flutter pub get
        working-directory: portable
      - run: flutter build linux --release
        working-directory: portable
      - run: node scripts/generate-icon.mjs
      - run: bash portable/tool/appimage.sh
      - run: cp portable/pubspec.lock release/
      - uses: actions/upload-artifact@v4
        with:
          name: OneStep-0.3.0-Linux
          path: |
            release/*.AppImage
            release/*.sha256
            release/pubspec.lock
