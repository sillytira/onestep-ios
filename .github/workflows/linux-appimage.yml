name: Build Linux AppImage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/linux-appimage.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb libfuse2 scrot dbus-x11 desktop-file-utils squashfs-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: node portable/tool/bootstrap.mjs
      - run: flutter pub get
        working-directory: portable
      - run: flutter build linux --release
        working-directory: portable
      - run: node scripts/generate-icon.mjs
      - run: bash portable/tool/appimage.sh
      - run: cp portable/pubspec.lock release/
      - uses: actions/upload-artifact@v4
        with:
          name: OneStep-0.3.0-Linux
          path: |
            release/*.AppImage
            release/*.sha256
            release/pubspec.lock
            release/OneStep-Linux-preview.png
